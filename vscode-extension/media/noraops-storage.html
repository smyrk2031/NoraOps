<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NoraOps — ストレージ</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#3b82f6; --warn:#f59e0b; --ok:#22c55e; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px 12px; max-width: 720px; font-size: 11px; }
  h1 { font-size: 14px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; line-height: 1.5; }
  .summary { background: var(--card); border-radius: 12px; padding: 14px 18px; margin-bottom: 16px; font-size: 14px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  button {
    border: 0;
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.35);
    transition: transform 0.07s ease-out, background-color 0.1s ease-out, box-shadow 0.1s ease-out, filter 0.1s ease-out, border-color 0.1s ease-out;
    -webkit-tap-highlight-color: transparent;
  }
  button:not(:disabled):hover { filter: brightness(1.07); box-shadow: 0 2px 6px rgba(15, 23, 42, 0.45); }
  button:not(:disabled):active { transform: scale(0.97) translateY(1px); filter: brightness(0.9); box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.35); }
  button:focus-visible { outline: 2px solid #93c5fd; outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
  button:disabled:active { transform: none; filter: none; box-shadow: none; }
  button.secondary { background: #475569; }
  button.ghost { background: transparent; border: 1px solid #475569; color: var(--muted); box-shadow: none; }
  button.ghost:not(:disabled):hover { border-color: #64748b; color: var(--text); background: rgba(148, 163, 184, 0.08); box-shadow: none; }
  button.ghost:not(:disabled):active { background: rgba(148, 163, 184, 0.18); border-color: #64748b; box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.25); }
  button.danger { background: #b91c1c; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #334155; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  tr.rec td { background: #42200633; }
  tr.fav td:first-child { border-left: 3px solid var(--ok); }
  .kind { font-size: 11px; color: var(--muted); }
  .star { cursor: pointer; font-size: 16px; border: none; background: none; padding: 0; color: var(--muted); }
  .star.on { color: #fbbf24; }
  .empty { color: var(--muted); padding: 20px; text-align: center; }
  .path-hint { font-family: Consolas, monospace; font-size: 11px; color: var(--muted); margin-top: 16px; word-break: break-all; }
</style>
</head>
<body>
  <h1>ストレージ</h1>
  <p class="sub" title="試用後に不要な venv や Runner の展開先を削除できます。お気に入りは削除候補から外れます。">
    この PC に溜まったデータを一覧します。90日以上使っていない項目は「削除候補」に表示されます。
  </p>

  <div class="summary" id="summary">読み込み中…</div>

  <div class="toolbar">
    <button type="button" id="btnRefresh" class="secondary" title="フォルダを再スキャン">更新</button>
    <button type="button" id="btnDeleteRec" class="danger" title="お気に入り以外の削除候補をまとめて削除">削除候補をまとめて削除</button>
    <button type="button" id="btnRunner" class="ghost" title="アプリ一覧へ">アプリを使う</button>
    <button type="button" id="btnHome" class="ghost" title="開発ホームへ">開発ホーム</button>
  </div>

  <table>
    <thead>
      <tr>
        <th title="削除候補から外す">★</th>
        <th>種類 / 名前</th>
        <th title="ディスク使用量の目安">容量</th>
        <th title="最終利用またはフォルダ更新日">最終利用</th>
        <th><input type="checkbox" id="chkAll" title="一括選択"/></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <p id="empty" class="empty" style="display:none">データはありません。</p>
  <p class="path-hint" id="rootPath"></p>

<script>
(function(){
  const vscode = acquireVsCodeApi();
  let state = { entries: [], recommended: [] };

  document.getElementById("btnRefresh").onclick = () => vscode.postMessage({ type: "refresh" });
  document.getElementById("btnRunner").onclick = () => vscode.postMessage({ type: "openRunner" });
  document.getElementById("btnHome").onclick = () => vscode.postMessage({ type: "openHome" });
  document.getElementById("btnDeleteRec").onclick = () => {
    const ids = state.recommended.filter((id) => {
      const e = state.entries.find((x) => x.id === id);
      return e && !e.favorite;
    });
    if (!ids.length) {
      alert("削除候補はありません。");
      return;
    }
    vscode.postMessage({ type: "deleteIds", ids });
  };
  document.getElementById("chkAll").onchange = (ev) => {
    document.querySelectorAll(".row-chk").forEach((c) => { c.checked = ev.target.checked; });
  };

  function render() {
    const tbody = document.getElementById("tbody");
    const empty = document.getElementById("empty");
    document.getElementById("summary").innerHTML =
      "合計 <b>" + escapeHtml(state.totalMb) + " MB</b> · " +
      state.entries.length + " 件 · 削除候補 " + state.recommended.length + " 件";
    document.getElementById("rootPath").textContent = state.root || "";

    if (!state.entries.length) {
      tbody.innerHTML = "";
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";
    tbody.innerHTML = "";
    for (const e of state.entries) {
      const tr = document.createElement("tr");
      if (state.recommended.includes(e.id)) tr.className = "rec";
      if (e.favorite) tr.className = (tr.className ? tr.className + " " : "") + "fav";
      const recHint = state.recommended.includes(e.id) && !e.favorite ? " · 削除候補" : "";
      tr.innerHTML =
        "<td><button type='button' class='star " + (e.favorite ? "on" : "") + "' data-id='" + escapeAttr(e.id) + "' title='お気に入り'>" +
        (e.favorite ? "★" : "☆") + "</button></td>" +
        "<td><div>" + escapeHtml(e.name) + recHint + "</div><div class='kind'>" + escapeHtml(e.kindLabel) + "</div></td>" +
        "<td>" + escapeHtml(e.sizeMb) + " MB</td>" +
        "<td>" + escapeHtml(e.lastUsedLabel) + "</td>" +
        "<td><input type='checkbox' class='row-chk' data-id='" + escapeAttr(e.id) + "'/></td>";
      tbody.appendChild(tr);
    }
    tbody.querySelectorAll(".star").forEach((btn) => {
      btn.onclick = () => {
        const id = btn.getAttribute("data-id");
        const ent = state.entries.find((x) => x.id === id);
        vscode.postMessage({ type: "toggleFavorite", id, value: !ent.favorite });
      };
    });
  }

  document.getElementById("tbody").addEventListener("dblclick", () => {
    const ids = [...document.querySelectorAll(".row-chk:checked")].map((c) => c.getAttribute("data-id"));
    if (ids.length) vscode.postMessage({ type: "deleteIds", ids });
  });

  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Delete") {
      const ids = [...document.querySelectorAll(".row-chk:checked")].map((c) => c.getAttribute("data-id"));
      if (ids.length) vscode.postMessage({ type: "deleteIds", ids });
    }
  });

  function escapeHtml(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function escapeAttr(s) {
    return String(s).replace(/"/g, "&quot;");
  }

  window.addEventListener("message", (e) => {
    if (e.data.type !== "state") return;
    state = e.data;
    render();
  });
})();
</script>
</body>
</html>
