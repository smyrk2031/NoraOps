<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<title>NoraOps 履歴</title>
<style>
  body { font-family: "Segoe UI", system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 16px; }
  h2 { margin: 0 0 12px; font-size: 18px; }
  .row { background: #1e293b; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .meta { font-size: 12px; color: #94a3b8; }
  .msg { font-size: 14px; margin-top: 4px; }
  button {
    border: 0;
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
    background: #3b82f6;
    color: #fff;
    font-size: 12px;
    white-space: nowrap;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.35);
    transition: transform 0.07s ease-out, background-color 0.1s ease-out, box-shadow 0.1s ease-out, filter 0.1s ease-out;
    -webkit-tap-highlight-color: transparent;
  }
  button:not(:disabled):hover { filter: brightness(1.07); box-shadow: 0 2px 6px rgba(15, 23, 42, 0.45); }
  button:not(:disabled):active { transform: scale(0.97) translateY(1px); filter: brightness(0.9); box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.35); }
  button:focus-visible { outline: 2px solid #93c5fd; outline-offset: 2px; }
  .empty { color: #94a3b8; font-size: 13px; }
</style>
</head>
<body>
<h2>保存の履歴</h2>
<p class="empty" id="empty">読み込み中…</p>
<div id="list"></div>
<script>
(function(){
  const vscode = acquireVsCodeApi();
  const list = document.getElementById("list");
  const empty = document.getElementById("empty");

  window.addEventListener("message", (e) => {
    if (e.data.type !== "history") return;
    const items = e.data.items || [];
    list.innerHTML = "";
    if (!items.length) {
      empty.textContent = "まだ履歴がありません。先に「保存」してください。";
      return;
    }
    empty.textContent = "";
    for (const it of items) {
      const row = document.createElement("div");
      row.className = "row";
      const left = document.createElement("div");
      left.innerHTML = '<div class="meta">' + (it.date || "") + " · " + (it.hash || "") + '</div><div class="msg">' + (it.message || "") + "</div>";
      const btn = document.createElement("button");
      btn.textContent = "この版に戻す";
      btn.onclick = () => vscode.postMessage({ type: "restore", hash: it.hash });
      row.appendChild(left);
      row.appendChild(btn);
      list.appendChild(row);
    }
  });

  vscode.postMessage({ type: "refresh" });
})();
</script>
</body>
</html>
